name: skills-ci

# Promotes scripts/ci/validate-skill.sh from `Optional hook` to `CI` on the
# ladder in docs/guides/patterns/encoding-invariants.md (issue #167, ADR 0017).
# `**/SKILL.md` covers every skill root (skills/mono, skills/{stages,reason,
# tools}/*) and any root added later. A green job here is not proof of
# merge blocking.

on:
  push:
    branches: [master]
    paths:
      - "**/SKILL.md"
      - "scripts/ci/validate-skill.sh"
      - "scripts/ci/validate-skills.sh"
      - "scripts/ci/fixtures/bad-skill/**"
      - "skills/stages/check/scripts/**"
      - "scripts/ci/test-panel-merge.py"
      - "scripts/ci/test-skill-scripts.sh"
      - "scripts/ci/test-risk-facts.sh"
      - "scripts/ci/fixtures/skill-scripts/**"
      - "skills/**/scripts/**"
      - ".github/workflows/skills-ci.yml"
  pull_request:
    paths:
      - "**/SKILL.md"
      - "scripts/ci/validate-skill.sh"
      - "scripts/ci/validate-skills.sh"
      - "scripts/ci/fixtures/bad-skill/**"
      - "skills/stages/check/scripts/**"
      - "scripts/ci/test-panel-merge.py"
      - "scripts/ci/test-skill-scripts.sh"
      - "scripts/ci/test-risk-facts.sh"
      - "scripts/ci/fixtures/skill-scripts/**"
      - "skills/**/scripts/**"
      - ".github/workflows/skills-ci.yml"

jobs:
  validate-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate every tracked SKILL.md
        run: bash scripts/ci/validate-skills.sh

      - name: Bad fixture must fail the same entrypoint
        run: |
          if bash scripts/ci/validate-skills.sh scripts/ci/fixtures/bad-skill/SKILL.md; then
            echo "::error::validate-skills.sh accepted scripts/ci/fixtures/bad-skill"
            exit 1
          fi

      - name: Validation left the checkout untouched
        run: test -z "$(git status --porcelain --ignored)"

  panel-merge:
    # Issue #156: fixture tests for the multi-model panel merge step.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Panel merge fixtures
        run: python3 -I scripts/ci/test-panel-merge.py

  skill-scripts:
    # Verification audit gap 5: one hit and one miss fixture per skill script.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Skill script fixtures
        run: bash scripts/ci/test-skill-scripts.sh

  risk-facts:
    # Verification audit gap 3: fixtures for the mechanical risk checks.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Risk facts fixtures
        run: bash scripts/ci/test-risk-facts.sh
